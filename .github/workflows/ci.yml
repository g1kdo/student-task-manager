name: CI

# The pipeline runs on every push and pull request to the long-lived
# branches, and can be triggered by hand for a re-run.
on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop, "feature/**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B --no-transfer-progress clean compile

      # A failing unit test fails this step, and therefore the whole pipeline.
      - name: Run unit and integration tests
        run: ./mvnw -B --no-transfer-progress test

      - name: Package the runnable jar and produce the coverage report
        run: ./mvnw -B --no-transfer-progress verify -DskipTests

      # End-to-end check: drive the packaged application through the menu on
      # stdin and assert on what it prints. This is what proves the artefact
      # just built actually runs, not merely that it compiled.
      - name: Smoke-test the packaged application
        run: |
          printf '1\nWrite sprint report\n2\n3\n1\n2\n5\n6\n' \
            | java -jar target/student-task-manager.jar > smoke.out 2>&1
          echo '----- application output -----'
          cat smoke.out
          echo '------------------------------'
          fail() { echo "::error::$1"; exit 1; }
          grep -q 'Task added'           smoke.out || fail 'add task did not confirm'
          grep -q 'Write sprint report'  smoke.out || fail 'task list did not render the task'
          grep -q 'Task completed'       smoke.out || fail 'complete task did not confirm'
          grep -q 'status=UP'            smoke.out || fail 'health check did not report UP'
          if grep -qi 'not a valid choice' smoke.out; then
            fail 'the menu rejected valid input (stale newline regression)'
          fi
          echo 'Smoke test passed.'

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Publish the runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: student-task-manager-jar
          path: |
            target/student-task-manager.jar
            target/lib/

  report:
    name: Compile the assessment report
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Builds docs/report/assessment-report.tex with a full TeX Live image, so
      # the submission PDF is produced by the pipeline rather than by hand.
      - name: Compile the LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: assessment-report.tex
          working_directory: docs/report
          latexmk_use_xelatex: false

      - name: Publish the report PDF
        uses: actions/upload-artifact@v4
        with:
          name: assessment-report-pdf
          path: docs/report/assessment-report.pdf
          if-no-files-found: error

  lab3-report:
    name: Compile the Lab 3 report
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile the Lab 3 LaTeX report
        id: lab3tex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: lab3-multi-stage-ai-workflow.tex
          working_directory: docs/lab3/report
          latexmk_use_xelatex: false

      # latexmk reports only "exit code 12", and downloading job logs needs
      # repo admin rights. Re-emitting the real errors as ::error:: puts them
      # into the run annotations, which are readable without those rights.
      - name: Surface LaTeX errors
        if: steps.lab3tex.outcome == 'failure'
        working-directory: docs/lab3/report
        run: |
          shopt -s nullglob
          for f in *.log; do
            grep -nE '^! |^l\.[0-9]+|Undefined control sequence|Error|Emergency stop|Missing |Illegal |Undefined column' "$f" \
              | head -40 \
              | while IFS= read -r line; do echo "::error file=${f}::${line}"; done
          done
          echo 'LaTeX compilation failed; the real errors are in the annotations above.'
          exit 1

      - name: Publish the Lab 3 report PDF
        uses: actions/upload-artifact@v4
        with:
          name: lab3-report-pdf
          path: docs/lab3/report/lab3-multi-stage-ai-workflow.pdf
          if-no-files-found: error

  lab3-schema-check:
    name: Validate the Stage 1 JSON Schema
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Re-runs the Stage 1 artefact check in CI, so the schema and its
      # conditional rule are verified on every push rather than once by hand.
      - name: Check the schema and its conditional rule
        working-directory: docs/lab3/artefacts/stage1
        run: |
          npm install --no-audit --no-fund
          npm run check
